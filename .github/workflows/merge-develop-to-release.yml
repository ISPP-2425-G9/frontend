name: Create PR from develop to release on Tag Creation

on:
  push:
    tags:
      - '*'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3
        
      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Fetch develop and release branches
        run: |
          git fetch origin develop
          git fetch origin release

      - name: Create PR from develop to release
        run: |
          PR_TITLE="Merge from develop to release on tag ${GITHUB_REF##*/}"
          PR_BODY="This PR is automatically created to merge the changes from develop into release triggered by tag ${GITHUB_REF##*/}"
          
          # Create a new branch from develop
          git checkout -b temp-branch develop
          
          # Merge develop into release
          git merge origin/release --no-ff --no-edit

          # Push the temporary branch
          git push origin temp-branch

          # Create a pull request
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"title": "'"${PR_TITLE}"'", "body": "'"${PR_BODY}"'", "head": "temp-branch", "base": "release"}' \
          https://api.github.com/repos/${{ github.repository }}/pulls

      - name: Clean up temporary branch
        run: |
          git push origin --delete temp-branch
          
  automerge:
    runs-on: ubuntu-latest
    needs: create-pr
    steps:
      - name: Wait for the workflow to finish
        uses: peter-evans/workflow-dispatch@v1

      - name: Automate merge
        run: |
          # Automate merge once the tests have passed and PR is ready to merge
          curl -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -d '{"merge": true}' \
          https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.create-pr.outputs.pr_number }}/merge
