name: Create PR from develop to release on Tag Creation

on:
  push:
    tags:
      - '*'
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Paso 2: Asegurarse de que las ramas remotas estén disponibles
      - name: Fetch all branches
        run: git fetch --all

      # Paso 3: Crear la rama temporal a partir de develop
      - name: Create PR from develop to release
        id: pr
        run: |
          # Configurar la identidad de git usando las credenciales de GitHub Actions
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

          # Obtener el nombre de la etiqueta
          TAG_NAME="${GITHUB_REF##*/}"
          PR_TITLE="Merge from develop to release on tag $TAG_NAME"
          PR_BODY="This PR is automatically created to merge the changes from develop into release triggered by tag $TAG_NAME"

          # Crear una nueva rama a partir de develop
          git checkout -b temp-branch origin/develop

          # Intentar hacer el merge de develop en release
          git merge origin/release --no-ff --no-edit

          # Empujar la rama temporal
          git push origin temp-branch

          # Crear el PR usando curl
          PR_RESPONSE=$(curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"title": "'"${PR_TITLE}"'", "body": "'"${PR_BODY}"'", "head": "temp-branch", "base": "release"}' \
            "https://api.github.com/repos/${{ github.repository }}/pulls")

          # Mostrar la respuesta completa para depuración
          echo "PR Response: $PR_RESPONSE"

          # Extraer el número del PR
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')

          # Verificar si el número del PR es válido
          if [ "$PR_NUMBER" == "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "Error: No se pudo obtener el número del PR. Respuesta de la API: $PR_RESPONSE"
            exit 1
          fi

          echo "Created PR #$PR_NUMBER"

          # Establecer el PR número como output para usarlo en el paso de merge
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      # Paso 4: Auto-merge el PR
      - name: Auto-merge Pull Request
        run: |
          PR_NUMBER=${{ env.PR_NUMBER }}
          
          # Verificar que el PR_NUMBER no sea null
          if [ "$PR_NUMBER" == "null" ] || [ -z "$PR_NUMBER" ]; then
            echo "PR number is invalid or not set. Exiting..."
            exit 1
          fi

          echo "Merging PR #$PR_NUMBER"

          # Usar GitHub CLI para hacer el merge automáticamente
          gh pr merge $PR_NUMBER --merge --admin

          # Verificar si el PR fue mergeado correctamente
          PR_STATE=$(gh pr view $PR_NUMBER --json state -q ".state")
          if [ "$PR_STATE" == "MERGED" ]; then
            echo "PR #$PR_NUMBER successfully merged."
            # Eliminar la rama temporal remota
            git push origin --delete temp-branch
            # Eliminar la rama temporal local
            git branch -d temp-branch
          else
            echo "PR #$PR_NUMBER was not merged successfully. Exiting..."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Aseguramos que GH_TOKEN esté configurado para el CLI
